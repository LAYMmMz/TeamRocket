name: Frontend / API integration checks
on:
  push:
    paths: ['backend/**', 'frontend/**', '.github/workflows/integration.yml']
  pull_request:
    paths: ['backend/**', 'frontend/**', '.github/workflows/integration.yml']
permissions:
  contents: read
jobs:
  backend-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t .
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check:scope
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Database UI regression checks
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/rocketpulse-vite.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173 > /dev/null; then break; fi
            sleep 1
          done
          npm run test:database-ui
