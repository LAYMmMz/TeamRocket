name: Frontend / API integration checks
on:
  push:
    paths: ['backend/app/integrations/frontend_api.py', 'backend/app/main.py', 'backend/tests/test_frontend_api_adapter.py', 'frontend/**', '.github/workflows/integration.yml']
  pull_request:
    paths: ['backend/app/integrations/frontend_api.py', 'backend/app/main.py', 'backend/tests/test_frontend_api_adapter.py', 'frontend/**', '.github/workflows/integration.yml']
permissions:
  contents: read
jobs:
  backend-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_frontend_api_adapter -v
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check:scope
      - run: npm run build
